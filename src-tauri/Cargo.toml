[package]
name = "sakura"
version = "0.5.2"
description = "SAKURA — catalogue et lecteur d'animes"
authors = ["you"]
license = "GPL-3.0-or-later"
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
serde_json = "1.0"
url = "2"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.1", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tokio = { version = "1", features = ["time"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

# Desktop only (Windows, Linux, macOS): tray, autostart, window state, self-update, Discord IPC.
[target.'cfg(any(target_os = "windows", target_os = "linux", target_os = "macos"))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-window-state = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
discord-rich-presence = "1.1"

# Mobile only: native haptics (the web Vibration API needs a permission the app doesn't have,
# and WKWebView has none).
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-haptics = "2"

# iPhone: edge-to-edge webview (shell::edge_to_edge_ios). Same version as Tauri's own.
[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6"

[features]
# Tests of the Discord Social SDK bindings on Linux (see build.rs); never in release builds.
social-sdk-test = []
