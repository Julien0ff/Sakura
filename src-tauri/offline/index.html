<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SAKURA — Pas de connexion</title>
<style>
  html,body{height:100%;margin:0}
  body{background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;box-sizing:border-box;user-select:none}
  main{max-width:420px}
  img{width:80px;height:80px;border-radius:20px}
  h1{font-size:26px;margin:20px 0 8px}
  p{color:#8E8E93;line-height:1.5;margin:0 0 24px}
  button{background:#FF7AA8;color:#000;font:inherit;font-weight:700;border:0;padding:12px 28px;border-radius:999px;cursor:pointer}
  button:disabled{opacity:.5;cursor:default}
</style>
</head>
<body>
<main>
  <img src="icon.png" alt="">
  <h1>Pas de connexion</h1>
  <p>SAKURA n’arrive pas à joindre le site. Vérifiez votre connexion internet, puis réessayez.</p>
  <button id="retry" type="button">Réessayer</button>
</main>
<script>
  const btn = document.getElementById('retry');
  let trying = false;
  // retry_connection navigates to the site when it answers; otherwise we stay here.
  async function retry(manual) {
    if (trying) return;
    trying = true;
    if (manual) { btn.disabled = true; btn.textContent = 'Connexion…'; }
    try {
      await window.__TAURI_INTERNALS__.invoke('retry_connection');
    } catch (e) {
      console.error(e);
    }
    trying = false;
    if (manual) setTimeout(() => { btn.disabled = false; btn.textContent = 'Réessayer'; }, 600);
  }
  btn.addEventListener('click', () => retry(true));
  // Launched at login before the network is up: retry on its own.
  window.addEventListener('online', () => retry(false));
  setInterval(() => retry(false), 10000);
</script>
</body>
</html>
