name: Diffusion Automatique Discord

on:
  push:
    branches:
      - main
    paths:
      - 'src/lib/changelog.ts'
  schedule:
    # Sorties d'épisodes (et nouveaux animes) : toutes les 15 min, décalé de l'heure pile
    # (GitHub retarde les crons lancés à :00).
    - cron: '7,22,37,52 * * * *'
    # Récap de la semaine : le dimanche à 18 h (heure de Paris, 17 h UTC en hiver).
    - cron: '3 17 * * 0'
  workflow_dispatch:
    inputs:
      action:
        description: "Type d'annonce à diffuser"
        required: true
        default: 'releases'
        type: choice
        options:
          - releases
          - recap
          - changelog

# Deux passages en même temps posteraient les mêmes épisodes deux fois.
concurrency:
  group: discord-announcements
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  announce:
    name: Diffuser sur Discord
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Configurer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Diffuser le Changelog
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'changelog') }}
        env:
          DISCORD_WEBHOOK_CHANGELOG: ${{ secrets.DISCORD_WEBHOOK_CHANGELOG }}
        run: node scripts/discord-announce.mjs changelog

      # Mémoire des épisodes déjà annoncés : dans le cache d'Actions, pas dans le dépôt
      # (un commit toutes les 15 min déclencherait un déploiement à chaque fois).
      - name: Restaurer l'état des annonces
        if: ${{ (github.event_name == 'schedule' && github.event.schedule != '3 17 * * 0') || (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'releases') }}
        uses: actions/cache/restore@v4
        with:
          path: data/discord-state.json
          key: discord-state-${{ github.run_id }}
          restore-keys: discord-state-

      - name: Diffuser les nouveaux épisodes et animes
        if: ${{ (github.event_name == 'schedule' && github.event.schedule != '3 17 * * 0') || (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'releases') }}
        env:
          DISCORD_WEBHOOK_EPISODES: ${{ secrets.DISCORD_WEBHOOK_EPISODES }}
          DISCORD_WEBHOOK_ANIMES: ${{ secrets.DISCORD_WEBHOOK_ANIMES }}
        run: node scripts/discord-announce.mjs releases

      - name: Diffuser le récap de la semaine
        if: ${{ (github.event_name == 'schedule' && github.event.schedule == '3 17 * * 0') || (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'recap') }}
        env:
          DISCORD_WEBHOOK_RECAP: ${{ secrets.DISCORD_WEBHOOK_RECAP }}
          DISCORD_WEBHOOK_EPISODES: ${{ secrets.DISCORD_WEBHOOK_EPISODES }}
          # Valeurs publiques (déjà dans le site) : le top SAKURA est sauté si elles manquent.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: node scripts/discord-announce.mjs recap

      - name: Sauvegarder l'état des annonces
        if: ${{ always() && ((github.event_name == 'schedule' && github.event.schedule != '3 17 * * 0') || (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'releases')) }}
        uses: actions/cache/save@v4
        with:
          path: data/discord-state.json
          key: discord-state-${{ github.run_id }}
