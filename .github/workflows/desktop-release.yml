# Builds the SAKURA desktop app (Windows + Linux) when a tag `app-v*` is pushed,
# and drafts a GitHub Release with the installers and the updater manifest (latest.json).
name: Desktop release

on:
  push:
    tags: ['app-v*']
  # A release created from the GitHub UI (tag app-v…): attach the builds to it.
  release:
    types: [published]
  # Manual run: Actions › Desktop release › Run workflow.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag de la release (ex. app-v0.1.0)'
        required: true

concurrency:
  group: desktop-release-${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    # Releases of the website (tags not starting with app-v) are ignored.
    if: startsWith(github.event.release.tag_name || inputs.tag || github.ref_name, 'app-v')
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf rpm

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
          releaseName: 'SAKURA ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}'
          releaseBody: 'Installez SAKURA pour Windows (.exe) ou Linux (AppImage, .deb, .rpm).'
          releaseDraft: true
          includeUpdaterJson: true
