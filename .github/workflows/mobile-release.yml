# Builds the SAKURA mobile apps and attaches them to the same GitHub release as the desktop app:
#   - Android: universal .apk, signed with the project key (secrets below)
#   - iPhone: unsigned .ipa, signed on the device by AltStore / SideStore
# The native projects (src-tauri/gen/android, src-tauri/gen/apple) are generated here, never committed.
name: Mobile release

on:
  push:
    tags: ['app-v*']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag de la release (ex. app-v0.4.0)'
        required: true

permissions:
  contents: write

concurrency:
  group: mobile-release-${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}

jobs:
  android:
    if: startsWith(github.event.release.tag_name || inputs.tag || github.ref_name, 'app-v')
    runs-on: ubuntu-latest
    env:
      HAS_SOCIAL_SDK: ${{ secrets.SOCIAL_SDK_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      # Discord Social SDK (mobile Discord status): private repo, never in this public one.
      # Without the SOCIAL_SDK_TOKEN secret the app builds without it (status « indisponible »).
      - name: Discord Social SDK
        if: env.HAS_SOCIAL_SDK == 'true'
        uses: actions/checkout@v4
        with:
          repository: Julien0ff/sakura-sdk
          token: ${{ secrets.SOCIAL_SDK_TOKEN }}
          path: .social-sdk
      - name: Discord Social SDK path
        run: |
          if [ "$HAS_SOCIAL_SDK" = "true" ]; then
            echo "DISCORD_SOCIAL_SDK=$GITHUB_WORKSPACE/.social-sdk" >> "$GITHUB_ENV"
          else
            echo "::warning::Secret SOCIAL_SDK_TOKEN absent : app compilée sans statut Discord."
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Default packages are « tools platform-tools », and « tools » no longer exists in recent
      # cmdline-tools: name the packages explicitly.
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools ndk;27.2.12479018 platforms;android-35 build-tools;35.0.0'

      - name: NDK path
        run: echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci

      - name: Generate the Android project
        run: |
          npx tauri android init --ci
          npx tauri icon public/icon.png
          # Launcher icon: our adaptive set (tauri icon puts a small logo on white).
          cp -R src-tauri/icons/android/res/. src-tauri/gen/android/app/src/main/res/

      - name: Add the Discord Social SDK
        if: env.HAS_SOCIAL_SDK == 'true'
        run: |
          # Rust links against the .so of each ABI (build.rs); the .aar ships them in the app.
          unzip -q -o "$DISCORD_SOCIAL_SDK/android/discord_partner_sdk.aar" 'jni/*' -d "$DISCORD_SOCIAL_SDK/android"
          python3 scripts/mobile/android-social-sdk.py src-tauri/gen/android "$DISCORD_SOCIAL_SDK" 1568341036894523432

      - name: Build
        run: npx tauri android build --apk

      - name: Sign
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secrets Android manquants (ANDROID_KEYSTORE_BASE64, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD, ANDROID_STORE_PASSWORD) : un .apk non signé ne s'installe pas."
            exit 1
          fi
          VERSION="${TAG#app-v}"
          UNSIGNED=$(find src-tauri/gen/android/app/build/outputs/apk -name '*-release-unsigned.apk' | head -1)
          BT="$ANDROID_HOME/build-tools/35.0.0"
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/sakura.jks"
          "$BT/zipalign" -p -f 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/sakura.jks" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:STORE_PASSWORD --key-pass env:KEY_PASSWORD \
            --out "SAKURA_${VERSION}_android.apk" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify "SAKURA_${VERSION}_android.apk"
          rm -f "$RUNNER_TEMP/sakura.jks"

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --draft --title "SAKURA $TAG"
          gh release upload "$TAG" SAKURA_*_android.apk --clobber

  ios:
    if: startsWith(github.event.release.tag_name || inputs.tag || github.ref_name, 'app-v')
    runs-on: macos-latest
    env:
      HAS_SOCIAL_SDK: ${{ secrets.SOCIAL_SDK_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      # Discord Social SDK (mobile Discord status): private repo, never in this public one.
      # Without the SOCIAL_SDK_TOKEN secret the app builds without it (status « indisponible »).
      - name: Discord Social SDK
        if: env.HAS_SOCIAL_SDK == 'true'
        uses: actions/checkout@v4
        with:
          repository: Julien0ff/sakura-sdk
          token: ${{ secrets.SOCIAL_SDK_TOKEN }}
          path: .social-sdk
      - name: Discord Social SDK path
        run: |
          if [ "$HAS_SOCIAL_SDK" = "true" ]; then
            echo "DISCORD_SOCIAL_SDK=$GITHUB_WORKSPACE/.social-sdk" >> "$GITHUB_ENV"
          else
            echo "::warning::Secret SOCIAL_SDK_TOKEN absent : app compilée sans statut Discord."
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci
      - run: brew install xcodegen

      - name: Generate the Xcode project
        run: |
          npx tauri ios init --ci
          npx tauri icon public/icon.png
          # Home screen icon: light + dark variants (src-tauri/icons/ios), single 1024 size.
          rm -rf src-tauri/gen/apple/Assets.xcassets/AppIcon.appiconset
          cp -R src-tauri/icons/ios/AppIcon.appiconset src-tauri/gen/apple/Assets.xcassets/

      - name: Add the Discord Social SDK
        if: env.HAS_SOCIAL_SDK == 'true'
        run: |
          node scripts/mobile/ios-social-sdk.mjs src-tauri/gen/apple "$DISCORD_SOCIAL_SDK"
          (cd src-tauri/gen/apple && xcodegen generate --spec project.yml)
          # Lets the SDK open the Discord app for « Authorize » when it is installed.
          PLIST=$(find src-tauri/gen/apple -maxdepth 2 -path '*_iOS/Info.plist' | head -1)
          /usr/libexec/PlistBuddy -c 'Add :LSApplicationQueriesSchemes array' "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c 'Add :LSApplicationQueriesSchemes: string discord' "$PLIST"

      # URL schemes, written by `tauri ios build` in a normal Tauri build (not used here):
      # sakura:// (sign-in comes back to the app) and discord-<id>:// (Discord « Authorize »).
      - name: URL schemes
        run: |
          PLIST=$(find src-tauri/gen/apple -maxdepth 2 -path '*_iOS/Info.plist' | head -1)
          PB=/usr/libexec/PlistBuddy
          $PB -c 'Delete :CFBundleURLTypes' "$PLIST" 2>/dev/null || true
          $PB -c 'Add :CFBundleURLTypes array' "$PLIST"
          $PB -c 'Add :CFBundleURLTypes:0 dict' "$PLIST"
          $PB -c 'Add :CFBundleURLTypes:0:CFBundleURLName string app.sakura.desktop' "$PLIST"
          $PB -c 'Add :CFBundleURLTypes:0:CFBundleURLSchemes array' "$PLIST"
          $PB -c 'Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string sakura' "$PLIST"
          $PB -c 'Add :CFBundleURLTypes:0:CFBundleURLSchemes:1 string discord-1568341036894523432' "$PLIST"
          $PB -c 'Print :CFBundleURLTypes' "$PLIST"

      # Xcode's « Build Rust Code » phase only works while `tauri ios build` runs, and that command
      # requires signing. Build the Rust library here and turn that phase into a no-op.
      - name: Build the Rust library
        working-directory: src-tauri
        run: |
          export SDKROOT=$(xcrun --sdk iphoneos --show-sdk-path)
          export IPHONEOS_DEPLOYMENT_TARGET=15.0
          cargo build --release --lib --target aarch64-apple-ios --features tauri/custom-protocol
          mkdir -p gen/apple/Externals/arm64/release
          cp target/aarch64-apple-ios/release/libapp_lib.a gen/apple/Externals/arm64/release/libapp.a
          PBX=$(find gen/apple -maxdepth 2 -name project.pbxproj | head -1)
          perl -0pi -e 's/shellScript = "(?:[^"\\]|\\.)*xcode-script(?:[^"\\]|\\.)*";/shellScript = "exit 0";/' "$PBX"
          if grep -q 'xcode-script' "$PBX"; then echo "::error::Phase « Build Rust Code » non neutralisée"; grep -n 'shellScript' "$PBX"; exit 1; fi

      - name: Build (unsigned)
        run: |
          PROJECT=$(find src-tauri/gen/apple -maxdepth 1 -name '*.xcodeproj' | head -1)
          SCHEME=$(xcodebuild -list -project "$PROJECT" | awk '/Schemes:/{f=1;next} f&&/_iOS/{gsub(/^ +/,"");print;exit}')
          echo "project=$PROJECT scheme=$SCHEME"
          xcodebuild -project "$PROJECT" -scheme "$SCHEME" -configuration release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build

      - name: Package .ipa
        run: |
          VERSION="${TAG#app-v}"
          APP=$(find build/Build/Products -maxdepth 2 -name '*.app' -path '*iphoneos*' | head -1)
          mkdir -p Payload && cp -R "$APP" Payload/
          zip -qry "SAKURA_${VERSION}_ios.ipa" Payload

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --draft --title "SAKURA $TAG"
          gh release upload "$TAG" SAKURA_*_ios.ipa --clobber
